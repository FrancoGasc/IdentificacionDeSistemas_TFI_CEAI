[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "IdentificacionSistemasPy"
version = "0.1.0"
description = "Identificacion parametrica de sistemas SISO en tiempo discreto: ARX, ARMAX, Output Error y Box-Jenkins por error de prediccion."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Franco Ezequiel Gasciunas" }]
keywords = [
    "system-identification",
    "identificacion-de-sistemas",
    "arx",
    "armax",
    "box-jenkins",
    "output-error",
    "prediction-error-method",
    "control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Spanish",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/FrancoGasc/IdentificacionDeSistemas_TFI_CEAI"
Repository = "https://github.com/FrancoGasc/IdentificacionDeSistemas_TFI_CEAI"

[tool.hatch.build.targets.wheel]
packages = ["src/identificacion_sistemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
